[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
via_ir = true
bytecode_hash = "none"

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 48
fail_on_revert = false

[fmt]
line_length = 120

[profile.fork]
test = "fork"
